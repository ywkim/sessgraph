<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sessgraph</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header>
      <h1>sessgraph</h1>
      <p id="summary" class="muted">읽는 중…</p>
    </header>
    <form id="search-form" class="search-form">
      <input
        id="search-input"
        type="search"
        name="q"
        placeholder="본문에서 찾기…"
        autocomplete="off"
      />
      <button type="submit">찾기</button>
      <div class="search-filters" id="search-filters">
        <fieldset class="search-tiers">
          <legend>종류</legend>
          <label
            ><input
              type="checkbox"
              name="tier"
              value="conversation"
              checked
            />대화</label
          >
          <label
            ><input
              type="checkbox"
              name="tier"
              value="tool"
              checked
            />도구</label
          >
          <label
            ><input
              type="checkbox"
              name="tier"
              value="meta"
              checked
            />기타</label
          >
        </fieldset>
        <label class="search-date"
          >기간
          <input type="date" id="search-from" aria-label="시작일" />
          ~
          <input type="date" id="search-to" aria-label="끝일" />
        </label>
      </div>
    </form>
    <div id="search-results"></div>
    <div id="banner" hidden></div>
    <div id="warnings"></div>
    <main id="timeline"></main>
    <script type="importmap">
      { "imports": { "marked": "/vendor/marked.esm.js" } }
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
